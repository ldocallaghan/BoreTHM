name: tests

# The fast suite on every push. The slow suite (Model 1 solves, the FORGE
# validations, the site table) on manual dispatch and weekly, with
# single-threaded BLAS, on the versions in requirements-lock.txt.

on:
  push:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version for the slow suite (the lock file's by default)"
        default: "3.14.4"
      goldens:
        description: "Also write the v1.3.3 golden table and upload it"
        type: boolean
        default: false
      v134-goldens:
        description: "Regenerate reviewed v1.3.4 site and lever goldens with their evidence"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

jobs:
  fast-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      # The fast suite includes a figure-output check.
      - run: python -m pip install ".[plot]"
      # Regression tests read the evidence retained in the checkout.
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --junitxml=fast-matrix.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-python-${{ matrix.python-version }}
          path: fast-matrix.xml

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install without the plotting extra and check outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/borethm-wheel"
          "$RUNNER_TEMP/borethm-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/borethm-wheel/bin/python" -c "import borethm; print(borethm.__version__)"
          "$RUNNER_TEMP/borethm-wheel/bin/borethm-evaluate" --help
          "$RUNNER_TEMP/borethm-wheel/bin/borethm-sites" --help
          "$RUNNER_TEMP/borethm-wheel/bin/borethm-water-table" --help
          "$RUNNER_TEMP/borethm-wheel/bin/python" "$GITHUB_WORKSPACE/tools/check_install.py"

  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: pytest

  slow:
    if: (github.event_name == 'workflow_dispatch' && !inputs.v134-goldens) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.14.4' }}
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: python -m borethm.water_table
      - run: pytest -m "slow or not slow" --durations=20 --junitxml=full-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-physical-regressions
          path: full-tests.xml

  goldens:
    # the v1.3.3 site table pinned in the CI environment, on the lock file's
    # versions; download the artifact and commit tests/golden/v133_site_table.json
    if: github.event_name == 'workflow_dispatch' && inputs.goldens
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: python -m borethm.water_table
      - run: python -m borethm.comparative_sites --write-golden > site_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v133-goldens
          path: |
            tests/golden/v133_site_table.json
            site_table.txt

  v134-goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.v134-goldens
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: python -m borethm.water_table
      - name: Generate fresh reviewed reference and lever tables
        run: python -m borethm.studies.release_v134 --output results/v1.3.4/ci/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify every fast and slow regression against the generated pins
        run: pytest -m "slow or not slow" --durations=12 --junitxml=v134-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-release
          path: |
            tests/golden/v134_site_table.json
            tests/golden/v134_lever_tables.json
            results/v1.3.4/ci/
            v134-tests.xml
