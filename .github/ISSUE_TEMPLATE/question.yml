name: Question
description: Ask about using BoreTHM or interpreting a result.
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to do and where you need help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the command or example, the input assumptions and the result field concerned. Remove private data.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and output
      description: Give the BoreTHM and Python versions and the relevant output.
