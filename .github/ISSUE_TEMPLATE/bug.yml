name: Bug report
description: Report an installation problem or unexpected behaviour.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behaviour and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Include the command or a small Python example, with the input assumptions. Remove private data.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Give the BoreTHM and Python versions, operating system, installation method and library versions if available.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      description: Paste the complete relevant output as text.
      render: text
