[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["borethm", "borethm.studies"]
namespaces = false

[tool.setuptools.package-data]
borethm = ["data/**/*.csv", "data/**/*.json", "data/**/*.md"]

[project]
name = "borethm"
version = "1.4.0"
description = "Models of circulating temperature and borehole stability for drilling into superhot rock"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Liam O'Callaghan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "iapws>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/ldocallaghan/BoreTHM"
