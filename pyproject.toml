[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["borethm", "borethm.studies"]
namespaces = false

[tool.setuptools.package-data]
borethm = ["data/**/*.csv", "data/**/*.json", "data/**/*.md", "templates/*.toml", "templates/sites/*.toml"]

[tool.setuptools.exclude-package-data]
borethm = ["data/**/*.py", "data/**/raw/**"]

[project]
name = "borethm"
version = "1.4.3"
description = "Models of circulating temperature and borehole stability for drilling into superhot rock"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-docs", "NOTICE"]
keywords = ["geothermal", "superhot rock", "drilling", "borehole stability", "insulated drill pipe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "Liam O'Callaghan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "iapws>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
borethm-new-site = "borethm.site_files:main"
borethm-evaluate = "borethm.site_evaluation:main"
borethm-sites = "borethm.comparative_sites:main"
borethm-water-table = "borethm.water_table:main"

[project.urls]
Repository = "https://github.com/ldocallaghan/BoreTHM"
Documentation = "https://ldocallaghan.github.io/BoreTHM/"
Changelog = "https://github.com/ldocallaghan/BoreTHM/blob/main/CHANGELOG.md"
Issues = "https://github.com/ldocallaghan/BoreTHM/issues"
