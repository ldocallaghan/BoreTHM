# Site inputs: Soultz-sous-Forets, the worked reference case.
# Replace the values and their sources with those for your site.
# The stress, strength and well-check provenance determine the evidence tier.
# Pore pressure and temperature provenance are also required by validation.
# An evidence-based tier does not mean every input is measured.
# Format guide: https://github.com/ldocallaghan/BoreTHM/blob/main/docs/guides/new-site.md
# Python API: https://github.com/ldocallaghan/BoreTHM/blob/main/docs/api.md

name = "Upper Rhine Graben / Soultz-sous-Forets (France)"

# Target depth [m]: 500 to 20,000; target temperature [C]: 50 to 600.
# The geotherm must give target_T within 5 C at the effective target depth.
target_depth = 10700.0
target_T = 400.0

# Historical inputs are still required for the original evaluation modes.
# Sv_grad is overburden stress per metre [Pa/m]: 15,000 to 35,000.
# K0_min is Shmin/Sv; SHmax_over_Sv is SHmax/Sv (dimensionless).
# Shmin and SHmax are the minimum and maximum horizontal stresses.
# These ratios have no separate validation range; current evaluations use
# the stress cases below. Sv_grad = 2650 kg/m3 * 9.81 m/s2 here.
Sv_grad = 25996.5
K0_min = 0.54
SHmax_over_Sv = 1.0

# Historical fluid pressure gradient [Pa/m]: 8,000 to 20,000.
# Current evaluations integrate the fluid column at its temperature.
rho_fluid_grad = 10000.0

# Rock thermal conductivity [W/(m K)]: 0.5 to 7.
# Young's modulus (stiffness) [Pa]: 5e9 to 150e9.
# These Soultz values are assumed; their provenance is stated below.
k_rock = 2.9
E_rock = 55e9

# Historical uniaxial compressive strength (UCS) at 25 C [Pa]: 10e6 to 500e6.
# Current evaluations use strength_cases, each within the same range.
UCS = 170e6
strength_cases = [["lab UCS 100", 100e6], ["lab UCS 115", 115e6], ["lab UCS 130", 130e6]]

# Fluid temperature at the pumps [C]: 0 to 100 (default 40).
T_inj = 40.0

# Deepest measured temperature [m]; omit when unknown.
temperature_data_to = 5000.0

# Friction coefficient (dimensionless): 0.2 to 1.5 (default 0.8).
# Used for frictional admissibility and the cap on maximum horizontal stress.
mu = 0.8
stress_basis = "measured range"

# Optional coupled flag (default false); evaluate also selects coupling
# according to its calculation mode. See the evaluate API documentation.
# coupled = false

# Optional replacements used by current evaluations; omit to use the inputs
# above. target_depth_v11 is in m, with the effective range 500 to 20,000.
# target_depth_v11 = 10700.0
# [geotherm_v11] accepts either geotherm form below.

[geotherm]
# Piecewise linear temperature: T_top + gradient * (z - z_top).
# Each row is [z_top in m, T_top in C, gradient in C/m].
# The first segment applies from the surface. Through the open hole,
# temperature must be finite and rise with depth.
form = "segments"
# At a boundary, "above" uses the segment ending there (Soultz's rule).
# "below" (the default) uses the segment starting there.
boundary = "above"
segments = [[0.0, 12.0, 0.090], [1400.0, 138.0, 0.0172], [5000.0, 200.0, 0.035]]

# Alternative: replace the entire [geotherm] table above with this table.
# Temperatures interpolate between [depth in m, temperature in C] points;
# gradient_below [C/m] extends the profile below the deepest point.
# [geotherm]
# form = "points"
# points = [[0.0, 12.0], [1400.0, 138.0], [5000.0, 200.0]]
# gradient_below = 0.035

# Stress profiles follow S(z) = grad * z + intercept [Pa gauge, z in m].
# Gauge pressure is relative to the model's atmosphere (0.1 MPa absolute).
# Pore pressure is Pp_grad * max(z - Pp_datum, 0) [Pa gauge].
# Pp_grad defaults to 10,000 Pa/m; Pp_datum defaults to 0 m.
# z_data gives the measured depth range [m]; omit when there are no data.
# Optional mu overrides the site's coefficient for this stress case.
# Optional regime: "normal", "strike-slip" or "reverse"; stresses must
# respect that order. They must be finite and positive, with SHmax >= Shmin
# and pore pressure below Shmin throughout the sampled open hole.
# Valley & Evans (2007), SGP-TR-183: measured range at 1.5 to 5.0 km.
[[stress_cases]]
label = "SHmax lower bound (0.90 Sv)"
Sv_grad = 25500.0
Sv_int = -1300000.0
Shmin_grad = 14060.0
Shmin_int = -1780000.0
SHmax_grad = 22950.0
SHmax_int = -1170000.0
source = "Valley & Evans (2007)"
z_data = [1500.0, 5000.0]

[[stress_cases]]
label = "SHmax mid-range"
Sv_grad = 25500.0
Sv_int = -1300000.0
Shmin_grad = 14060.0
Shmin_int = -1780000.0
SHmax_grad = 24865.0
SHmax_int = -1270000.0
source = "Valley & Evans (2007)"
z_data = [1500.0, 5000.0]

[[stress_cases]]
label = "SHmax upper bound (1.05 Sv)"
Sv_grad = 25500.0
Sv_int = -1300000.0
Shmin_grad = 14060.0
Shmin_int = -1780000.0
SHmax_grad = 26780.0
SHmax_int = -1370000.0
source = "Valley & Evans (2007)"
z_data = [1500.0, 5000.0]

# Alternative when only the normal/strike-slip transition regime is known:
# remove all [[stress_cases]] tables and use this rule.
# Sv_grad [Pa/m] and source are required. Optional Sv_int [Pa] defaults to
# 0; Pp_grad [Pa/m] to 10,000; mu to 0.8; fractions to the five values below.
# SHmax equals Sv. Each fraction sets Shmin between the frictional floor
# (0) and Sv (1). This rule's mu is separate from the site's top-level mu.
# [stress_rule]
# form = "transitional"
# Sv_grad = 25996.5
# source = "Replace with the source of the faulting regime and overburden"
# Sv_int = 0.0
# Pp_grad = 10000.0
# mu = 0.8
# fractions = [0.0, 0.25, 0.5, 0.75, 1.0]

[data_basis]
# Each entry is [basis, source]. Replace both when you change an input.
# Accepted basis labels: calibrated, measured, measured range,
# measured (lab), log-derived, checked, regime bounds, extrapolated,
# regional, assumed, not reproduced, unsourced, none.
stress = ["measured range", "Valley & Evans (2007), 1.5-5.0 km"]
strength = ["measured (lab)", "Valley & Evans (2007): 10 samples, 100-130 MPa; not calibrated in situ"]
"pore pressure" = ["measured", "near-hydrostatic (Valley & Evans 2007)"]
temperature = ["extrapolated", "200 C at 5 km measured (GPK wells); 35 C/km assumed below"]
"well check" = ["checked", "GPK3/GPK4 breakout onset and occurrence (crosscheck_soultz.py)"]
conductivity = ["assumed", "2.9 W/(m K), representative granite value; no Soultz measurement source identified in the repository"]
stiffness = ["assumed", "55 GPa, representative granite value; no Soultz measurement source identified in the repository"]
