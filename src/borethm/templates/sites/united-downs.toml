# United Downs / Carnmenellis (UK)
# Generated by tools/build_site_files.py from borethm.comparative_sites.CORNWALL.
# Snapshot of the built-in inputs in the generation environment.
# Recomputed numerical fits can differ in their last digits across platforms.
# Edit a copy for your site; regenerate this file from the Python definition.
# Units: depths m; temperatures C; gradients Pa/m or C/m as named;
# stresses and strengths Pa; conductivity W/(m K); ratios dimensionless.
# Stress and pore pressure use gauge values relative to 0.1 MPa absolute.
# Geotherm tables: borethm.comparative_sites.make_geotherm.
# Corrected target depth: 5000 + (400 - 180) / 0.028 in the CORNWALL definition.

name = "United Downs / Carnmenellis (UK)"
target_depth = 12500.0
target_T = 400.0
Sv_grad = 25800.300000000003
K0_min = 0.55
SHmax_over_Sv = 1.4
rho_fluid_grad = 10000.0
k_rock = 3.3
E_rock = 60000000000.0
UCS = 180000000.0
T_inj = 40.0
stress_basis = "measured"
strength_cases = [["intact, 0 K", 203000000.0], ["intact, 40 K", 172000000.0], ["weak zones, 0 K", 147000000.0], ["weak zones, 40 K", 118000000.0]]
target_depth_v11 = 12857.142857142857
temperature_data_to = 5058.0
mu = 0.8
coupled = false

[geotherm]
form = "segments"
boundary = "below"
segments = [
    [0, 15, 0.035],
    [5000, 190, 0.028],
]

[geotherm_v11]
form = "segments"
boundary = "below"
segments = [
    [0, 15, 0.033],
    [5000, 180, 0.028],
]

[[stress_cases]]
label = "Reinecker et al. (2021)"
Sv_grad = 25275.0
Shmin_grad = 13210.0
SHmax_grad = 25990.0
Sv_int = 0.0
Shmin_int = 3000000.0
SHmax_int = 5900000.0
Pp_grad = 9494.0
Pp_datum = 61.0
source = "Reinecker et al. (2021), Geothermics 97, 102226"
z_data = [0.0, 2000.0]

[data_basis]
"stress" = ["measured", "Reinecker et al. (2021); Shmin data to 2.0 km, SHmax derived at mu 0.8"]
"strength" = ["calibrated", "UD-1 breakouts, BGS image log (calibrate_ud1.py)"]
"pore pressure" = ["measured", "Reinecker et al. (2021)"]
"temperature" = ["extrapolated", "~180 C at 5 km (Reinecker et al. 2021); 28 C/km assumed below"]
"well check" = ["calibrated", "UD-1 to 5,058 m TVD (calibrate_ud1.py)"]

# Operations: optional. Each key states a choice the evaluator otherwise
# makes by its own rule; leave a key out to keep that rule. Remove the
# leading "# " from [operations] and from each key you state. A stated
# flow, connection practice, staging, rate of penetration or fluid is used
# as given: if it fails a check, the result reports the failure and the
# evaluator does not search for another value.
# [operations]
# Pipe candidates, tried in order. Default: the four below. Also accepted:
# "dual-wall" and "vacuum-insulated (sensitivity)", which are not on sale.
# pipes = ["TK-Drakon coated", "internally coated", "externally coated", "conventional"]
# One fixed flow, 1 to 300: a mass flow in kg/s, or a volume flow in L/s
# at surface (at the fluid's density at 20 C). Default: the flow search.
# Give at most one of the four flow keys.
# mass_flow_kg_s = 30.0
# volume_flow_L_s = 30.0
# The flows the search tries, rising, as mass or volume flows. Default:
# 5 to 50 in steps of 5, then 60 to 100 in steps of 10, in kg/s with
# water and in L/s with a weighted fluid.
# mass_flows_kg_s = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100]
# volume_flows_L_s = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100]
# Downhole tool temperature limit, C, 50 to 400. Default 200.
# tool_limit_C = 200.0
# Standpipe pressure limit, Pa, 1e6 to 150e6. Default 51.7e6 (7,500 psi).
# pump_pressure_limit_Pa = 51.7e6
# Rig pumps, 1 to 10. Default 3 (each 1,980 hydraulic hp, 7,475 psi).
# rig_pumps = 3
# Hole-cleaning annular velocity, m/s, 0.05 to 5. Default 1.245.
# min_annular_velocity_m_s = 1.245
# Circulation after the last new hole before a connection, min, 0 to 240.
# Default 0.33 (FORGE 16B, 10th percentile). Stating it or
# connection_p90_min ends the connection schedule search.
# precirculation_min = 0.33
# Connection with the pumps off, min, 0.1 to 480. Defaults: FORGE 16B
# median 2.83 and 90th percentile 6.33.
# connection_median_min = 2.83
# connection_p90_min = 6.33
# Time the bottom of the hole is static for a trip, h, 0.5 to 500.
# Default: FORGE 16B tripping speeds and surface time, scaled to the
# target depth. trip_scale, 0.05 to 20, multiplies that rule. Give one.
# trip_hours = 17.5
# trip_scale = 1.0
# Run-in staging: interval, m, 10 to 10,000, and circulation at each
# stage, min, 0.5 to 600. Defaults: FORGE 16B 144.88 m and 15.51 min,
# then a search over shorter intervals and longer stages. Stating either
# ends the search.
# stage_spacing_m = 144.88
# stage_minutes = 15.51
# Rate of penetration, m/h, 0.1 to 100. Default: Model 3, iterated with
# the wall's exposure for a coupled site.
# rop_m_h = 10.0
# Drilling and trip fluid surface densities at 20 C, kg/m3, 990 to 2,600.
# Defaults: the common windows' lower bounds, iterated with the
# circulation. A value below water's 998.2 is water.
# drilling_fluid_kg_m3 = 1100.0
# trip_fluid_kg_m3 = 1150.0
# Coating ratings, C, by pipe name. Default: TK-Drakon coated 204. A
# stated table replaces the default, so a pipe left out has no rating.
# [operations.coating_ratings_C]
# "TK-Drakon coated" = 204.0
# Sources for stated values, [basis, source], with the data_basis labels.
# [operations.sources]
# tool_limit_C = ["assumed", "Replace with the tool's rating sheet"]

# Hydraulic programme: optional. Without it the evaluator uses its
# reference string and casing scenario. A custom string lists its segments
# from surface to bit; their lengths must add up to the target depth.
# Each segment gives either pipe, naming one of the model's pipe types
# ("TK-Drakon coated", "internally coated", "externally coated",
# "conventional", "dual-wall" or "vacuum-insulated (sensitivity)"), or a
# single wall layer through bore_diameter and outer_diameter [m] and
# conductivity [W/(m K)], with an optional name and source. pipe cannot be
# combined with those keys. A segment may also give hydraulic_joint,
# local_loss, tool_loss and tools. Without hole intervals the reference
# casing scenario applies. The example's lengths add up to 10,700 m.
# [programme]
# [[programme.segments]]
# length = 1000.0
# pipe = "vacuum-insulated (sensitivity)"
# [[programme.segments]]
# length = 9233.2
# pipe = "TK-Drakon coated"
# [[programme.segments]]
# length = 466.8
# name = "drill collar"
# bore_diameter = 0.0714
# outer_diameter = 0.1714
# conductivity = 45.0
